{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mi Proyecto{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    {% block extra_css %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Mi CRUD Django</span>
    </div>
</nav>

<main class="flex-fill">
    <div class="container-fluid mt-4 px-0 px-md-4">
        <div class="row justify-content-center">
            <div class="col-sm-12 col-md-11 col-lg-10 col-xl-9">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </div>
</main>

<footer class="bg-dark text-white text-center py-3">
    <div class="container">
        <small>
            © {% now "Y" %} Mi CRUD Django
        </small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

{% block extra_js %}{% endblock %}

</body>
</html>
