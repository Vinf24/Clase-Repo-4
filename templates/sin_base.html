{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CRUD Productos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Mi CRUD Django</span>
    </div>
</nav>

<main class="flex-fill">
    <div class="container-fluid mt-4 px-0 px-md-4">
        <div class="row justify-content-center">
            <div class="col-sm-12 col-md-11 col-lg-10 col-xl-9">

                <div class="card shadow main-card mx-auto">
                    <div class="card-body">

                        <h1 class="text-center mb-4">Gestión de Productos</h1>

                        <h4>Crear Producto</h4>

                        <form id="productForm" class="mb-4">

                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" id="name" class="form-control" required placeholder="Ej: Camiseta">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Descripción</label>
                                <textarea id="description" class="form-control" placeholder="Ej: Camiseta de algodón de color rojo"></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Precio</label>
                                    <input type="number" id="price" class="form-control" required placeholder="Ej: 19.99">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Stock</label>
                                    <input type="number" id="stock" class="form-control" required placeholder="Ej: 50">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                Guardar Producto
                            </button>

                        </form>

                        <hr>

                        <h4>Lista de Productos</h4>
                        <ul id="productList" class="list-group"></ul>

                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Editar Producto</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <input type="hidden" id="editId">

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" id="editName" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea id="editDescription" class="form-control"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Precio</label>
                    <input type="number" id="editPrice" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Stock</label>
                    <input type="number" id="editStock" class="form-control">
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn btn-primary" onclick="updateProduct()">
                    Guardar Cambios
                </button>
            </div>

        </div>
    </div>
</div>

<footer class="bg-dark text-white text-center py-3 mt-auto">
    <div class="container">
        <small>
            © 2026 Mi CRUD Django
        </small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/app.js"></script>

</body>
</html>
