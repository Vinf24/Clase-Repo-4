{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CRUD Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>

<div class="container">
    <div class="card shadow main-card">
        <div class="card-body">

            <h1 class="text-center mb-4">Gestión de Productos</h1>

            <h4>Crear Producto</h4>

            <form id="productForm" class="mb-4">

                <div class="mb-3">
                    <label for="name" class="form-label">Nombre</label>
                    <input type="text" id="name" name="name" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Descripción</label>
                    <textarea id="description" name="description" rows="3" class="form-control"></textarea>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="price" class="form-label">Precio</label>
                        <input type="number" id="price" name="price" step="0.01" class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="stock" class="form-label">Stock</label>
                        <input type="number" id="stock" name="stock" class="form-control" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Guardar Producto
                </button>

            </form>

            <div id="message"></div>

            <hr>

            <h4>Lista de Productos</h4>
            <ul id="productList" class="list-group"></ul>

        </div>
    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Editar Producto</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="editId">

        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" id="editName" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Descripción</label>
          <textarea id="editDescription" class="form-control"></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">Precio</label>
          <input type="number" id="editPrice" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Stock</label>
          <input type="number" id="editStock" class="form-control">
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-primary" onclick="updateProduct()">Guardar Cambios</button>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/app.js' %}"></script>
</body>
</html>
