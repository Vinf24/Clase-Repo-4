{% extends "base.html" %}
{% load static %}

{% block title %}CRUD Productos{% endblock %}

{% block content %}

<div class="card shadow main-card mx-auto">
    <div class="card-body">

        <h1 class="text-center mb-4">Gestión de Productos</h1>

        <h4>Crear Producto</h4>

        <form id="productForm" class="mb-4">

            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" id="name" class="form-control" required placeholder="Ej: Camiseta">
            </div>

            <div class="mb-3">
                <label class="form-label">Descripción</label>
                <textarea id="description" class="form-control" placeholder="Ej: Camiseta de algodón de color rojo"></textarea>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Precio</label>
                    <input type="number" id="price" class="form-control" required placeholder="Ej: 19.99">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Stock</label>
                    <input type="number" id="stock" class="form-control" required placeholder="Ej: 50">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Guardar Producto
            </button>

        </form>

        <hr>

        <h4>Lista de Productos</h4>
        <ul id="productList" class="list-group"></ul>

    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Editar Producto</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <input type="hidden" id="editId">

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" id="editName" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea id="editDescription" class="form-control"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Precio</label>
                    <input type="number" id="editPrice" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Stock</label>
                    <input type="number" id="editStock" class="form-control">
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn btn-primary" onclick="updateProduct()">
                    Guardar Cambios
                </button>
            </div>

        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script src="{% static 'js/app.js' %}"></script>
{% endblock %}
